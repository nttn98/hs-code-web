<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HS Code + AI Chat</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- LEFT PANEL -->
      <div class="panel left-panel">
        <header>
          <h1>🔍 TRA CỨU MÃ HS AI</h1>
          <p class="subtitle">Tìm kiếm thông minh & Phân cấp Caselaw</p>
        </header>

        <div class="search-area">
          <div class="input-wrapper">
            <input
              type="text"
              id="query"
              placeholder="Nhập tên sản phẩm (VD: thịt bò đông lạnh...)"
              onkeypress="if(event.key==='Enter') handleSearch()"
            />
            <button onclick="handleSearch()" id="searchBtn">TÌM KIẾM</button>
          </div>

          <div id="loading" class="loading-spinner hidden">
            <div class="spinner"></div>
            <span>AI đang phân tích dữ liệu...</span>
          </div>
        </div>

        <div id="resultCard" class="result-card hidden">
          <div class="ai-result-section">
            <div class="hs-badge">KẾT QUẢ DỰ ĐOÁN</div>
            <h2 id="resHsCode"></h2>
          </div>

          <div class="caselaw-section">
            <h3>📋 Phân cấp biểu thuế</h3>
            <div id="hierarchyContent" class="hierarchy-tree"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="panel right-panel">
        <div class="chat-header">Chat chuyên gia hải quan</div>

        <div id="chatBox" class="chat-box">
          <div class="empty-state">
            <p>Xin chào! Tôi có thể giúp gì cho bạn về hải quan?</p>
          </div>
        </div>

        <div class="chat-input-wrapper">
          <input
            type="text"
            id="chatInput"
            placeholder="Nhập câu hỏi của bạn..."
            onkeypress="if(event.key==='Enter') sendChat()"
          />
          <button onclick="sendChat()">Gửi</button>
        </div>
      </div>
    </div>

    <!-- Custom Popup Modal -->
    <div id="customPopup" class="popup-overlay hidden">
      <div class="popup-content">
        <div class="popup-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMessage"></p>
        <button onclick="closePopup()" class="popup-btn">Đóng</button>
      </div>
    </div>

    <script>
      // ==================== POPUP FUNCTIONS ====================
      function showPopup(title, message, type = "info") {
        const popup = document.getElementById("customPopup");
        const icon = document.getElementById("popupIcon");
        const titleEl = document.getElementById("popupTitle");
        const messageEl = document.getElementById("popupMessage");

        // Set icon based on type
        const icons = {
          success: "✅",
          error: "❌",
          warning: "⚠️",
          info: "ℹ️",
        };

        icon.textContent = icons[type] || icons["info"];
        titleEl.textContent = title;
        messageEl.textContent = message;

        popup.classList.remove("hidden");

        // Auto close after 5 seconds for success messages
        if (type === "success") {
          setTimeout(closePopup, 5000);
        }
      }

      function closePopup() {
        document.getElementById("customPopup").classList.add("hidden");
      }

      // ==================== VALIDATION FUNCTIONS ====================
      function validateSearchInput(value) {
        const errors = [];

        if (!value || value.trim().length === 0) {
          errors.push("Vui lòng nhập tên sản phẩm");
        } else if (value.trim().length < 3) {
          errors.push("Tên sản phẩm phải có ít nhất 3 ký tự");
        } else if (value.trim().length > 200) {
          errors.push("Tên sản phẩm không được quá 200 ký tự");
        }

        // Check for special characters that might cause issues
        const dangerousChars = /[<>{}]/;
        if (dangerousChars.test(value)) {
          errors.push("Tên sản phẩm không được chứa ký tự đặc biệt < > { }");
        }

        return errors;
      }

      function validateChatInput(value) {
        const errors = [];

        if (!value || value.trim().length === 0) {
          return errors; // Empty is OK for chat, just don't send
        }

        if (value.trim().length > 1000) {
          errors.push("Tin nhắn không được quá 1000 ký tự");
        }

        return errors;
      }

      function showInputError(inputId, message) {
        const input = document.getElementById(inputId);
        input.classList.add("input-error");

        // Remove error class after 3 seconds
        setTimeout(() => {
          input.classList.remove("input-error");
        }, 3000);

        showPopup("Lỗi nhập liệu", message, "warning");
      }

      // ==================== SEARCH FUNCTION ====================
      async function handleSearch() {
        const queryVal = document.getElementById("query").value.trim();
        const btn = document.getElementById("searchBtn");
        const loading = document.getElementById("loading");
        const card = document.getElementById("resultCard");

        // Validation
        const validationErrors = validateSearchInput(queryVal);
        if (validationErrors.length > 0) {
          showInputError("query", validationErrors.join(". "));
          return;
        }

        // Update button text to show loading
        const originalBtnText = btn.textContent;
        btn.textContent = "Đang tìm...";
        btn.disabled = true;
        loading.classList.remove("hidden");
        card.classList.add("hidden");

        try {
          const response = await fetch("/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: queryVal }),
          });

          const data = await response.json();

          if (response.ok) {
            document.getElementById("resHsCode").innerText = data.hs_code;

            const hierarchyDiv = document.getElementById("hierarchyContent");
            hierarchyDiv.innerHTML = "";

            if (data.caselaw && data.caselaw.chapter) {
              let html = `<div class="chapter-node">${data.caselaw.chapter}</div><ul class="tree-list">`;
              const groups =
                data.caselaw.chapter_groups[data.caselaw.chapter] || [];
              groups.forEach((item) => {
                const isMatch = item.includes(data.hs_code);
                html += `<li class="${
                  isMatch ? "match-item" : ""
                }">${item}</li>`;
              });
              html += `</ul>`;
              hierarchyDiv.innerHTML = html;
            } else {
              hierarchyDiv.innerHTML =
                "<p class='no-data'>Không có dữ liệu phân cấp từ Caselaw.</p>";
            }

            card.classList.remove("hidden");
          } else {
            showPopup(
              "Lỗi tìm kiếm",
              data.error || "Không thể tìm thấy kết quả",
              "error"
            );
          }
        } catch (err) {
          console.error(err);
          showPopup(
            "Lỗi kết nối",
            "Không thể kết nối đến server. Vui lòng thử lại sau.",
            "error"
          );
        } finally {
          btn.disabled = false;
          btn.textContent = originalBtnText;
          loading.classList.add("hidden");
        }
      }

      // ==================== CHAT FUNCTIONS ====================
      function addMessage(text, type) {
        const chatBox = document.getElementById("chatBox");

        // Remove empty state if exists
        const emptyState = chatBox.querySelector(".empty-state");
        if (emptyState) {
          emptyState.remove();
        }

        const div = document.createElement("div");
        div.className = `chat-bubble ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function addTypingIndicator() {
        const chatBox = document.getElementById("chatBox");
        const typing = document.createElement("div");
        typing.className = "chat-bubble bot typing-indicator";
        typing.id = "typingIndicator";
        typing.innerHTML = "<span></span><span></span><span></span>";
        chatBox.appendChild(typing);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function removeTypingIndicator() {
        const typing = document.getElementById("typingIndicator");
        if (typing) {
          typing.remove();
        }
      }

      async function sendChat(messageFromClick = null) {
        const input = document.getElementById("chatInput");
        const msg = messageFromClick || input.value.trim();

        if (!msg) return;

        // Validation
        const validationErrors = validateChatInput(msg);
        if (validationErrors.length > 0) {
          showInputError("chatInput", validationErrors.join(". "));
          return;
        }

        if (!messageFromClick) addMessage(msg, "user");
        input.value = "";

        // Show typing indicator
        addTypingIndicator();

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
          });

          if (!res.ok) {
            throw new Error("Server error");
          }

          const data = await res.json();

          // Remove typing indicator before showing response
          removeTypingIndicator();

          addMessage(data.answer, "bot");
        } catch (err) {
          console.error(err);
          removeTypingIndicator();
          addMessage("Xin lỗi, đã có lỗi xảy ra. Vui lòng thử lại.", "bot");
          showPopup(
            "Lỗi chat",
            "Không thể gửi tin nhắn. Vui lòng thử lại.",
            "error"
          );
        }
      }

      // ==================== EVENT LISTENERS ====================
      // Close popup when clicking outside
      document
        .getElementById("customPopup")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            closePopup();
          }
        });

      // Escape key to close popup
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          closePopup();
        }
      });
    </script>
  </body>
</html>
