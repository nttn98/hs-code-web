<!-- sidebar.html - Reusable Sidebar Component -->
<aside class="sidebar">
  <div class="logo">HS SYSTEM</div>
  <ul class="menu">
    <li id="nav-internal">
      <a href="/hs_internal">
        <span class="menu-icon">🏢</span>
        <span>HS Internal</span>
      </a>
    </li>
    <!-- <li id="nav-external" class="disabled">
      <a href="/hs_external">
        <span class="menu-icon">🌐</span>
        <span>HS External</span>
      </a>
    </li> -->
  </ul>

  <div
    class="sidebar-footer"
    style="position: absolute; bottom: 0; left: 10; width: 260px"
  >
    <div class="version-info">
      <span class="version-label">Version</span>
      <span class="version-number" id="appVersion">Loading...</span>
    </div>
  </div>
</aside>

<script>
  // Set active navigation based on current page
  const currentPath = window.location.pathname;
  if (currentPath.includes("hs_internal")) {
    document.getElementById("nav-internal").classList.add("active");
  } else if (currentPath.includes("hs_external")) {
    document.getElementById("nav-external").classList.add("active");
  }

  // Fetch version from Git tag
  async function getGitVersion() {
    try {
      const response = await fetch("/api/version");
      const data = await response.json();
      document.getElementById("appVersion").textContent =
        data.version || "v1.0.0";
    } catch (error) {
      console.error("Failed to fetch version:", error);
      document.getElementById("appVersion").textContent = "v1.0.0";
    }
  }

  getGitVersion();
</script>
