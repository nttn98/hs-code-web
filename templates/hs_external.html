<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HS Global | AI Assistant</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./static/styles_external.css" />
    <link rel="stylesheet" href="./static/styles.css" />
  </head>

  <body>
    <div class="layout">
      {% include "sidebar.html" %}
      <main class="content">
        <div class="content-wrapper">
          <div class="header-section">
            <h2>AI HS Code Assistant</h2>
            <p class="subtitle">
              Phân loại mã HS thông minh theo mô tả hàng hóa
            </p>
          </div>

          <div class="chat-container">
            <div class="chat-header">
              <div class="chat-title">Chatbot</div>

              <div class="chat-steps">
                <span class="step step-1 active">1 Mô tả</span>
                <span class="step step-2">2 Nhóm HS</span>
                <span class="step step-3">3 Xác nhận</span>
              </div>

              <span id="status-badge" class="status-badge pending">
                ⏳ Sẵn sàng
              </span>
            </div>

            <div id="chat-box" class="chat-box">
              <div class="chat-message bot">
                Nhập mô tả hàng hóa → chọn nhóm HS → xác nhận mã HS chính xác.
              </div>
            </div>

            <div class="chat-input-container">
              <div class="input-wrapper">
                <textarea
                  id="chat-input"
                  rows="1"
                  placeholder="VD: Máy phay CNC dùng trong gia công kim loại..."
                ></textarea>
                <button id="send-btn">
                  <i class="fas fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const chatBox = document.getElementById("chat-box");
      const chatInput = document.getElementById("chat-input");
      const sendBtn = document.getElementById("send-btn");
      const statusBadge = document.getElementById("status-badge");

      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault(); // không xuống dòng
          sendBtn.click(); // trigger gửi
        }
      });

      let selectedLeaf = null;

      /* utils */
      function addUser(text) {
        chatBox.innerHTML += `<div class="chat-message user">${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      function addBot(html) {
        const d = document.createElement("div");
        d.className = "chat-message bot";
        d.innerHTML = html;
        chatBox.appendChild(d);
        chatBox.scrollTop = chatBox.scrollHeight;
        return d;
      }
      function setStep(step) {
        document
          .querySelectorAll(".step")
          .forEach((s) => s.classList.remove("active"));
        document.querySelector(".step-" + step).classList.add("active");
      }

      /* auto grow */
      chatInput.addEventListener("input", () => {
        chatInput.style.height = "auto";
        chatInput.style.height = chatInput.scrollHeight + "px";
      });

      /* SEND */
      sendBtn.onclick = async () => {
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = "";
        addUser(text);

        sendBtn.classList.add("loading");

        if (!selectedLeaf) await searchLeaf(text);
        else await confirmHs(text);

        sendBtn.classList.remove("loading");
      };

      /* STEP 1 */
      async function searchLeaf(text) {
        setStep(2);
        statusBadge.textContent = "⚡ Đang tìm nhóm HS...";

        const res = await fetch("/api/hs/external/search-leaf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text }),
        });
        const data = await res.json();

        const bot = addBot("");
        bot.innerHTML = data.groups
          .map(
            (g) => `<div class="hs-group" data-code="${g.code}">
            <b style="padding-right: 10px;">${g.code}</b> ${g.name}
          </div>`
          )
          .join("");

        bot.querySelectorAll(".hs-group").forEach((el) => {
          el.onclick = () => {
            selectedLeaf = el.dataset.code;
            loadHs(selectedLeaf);
          };
        });
      }

      /* STEP 2 */
      async function loadHs(code) {
        setStep(3);
        statusBadge.textContent = "📦 Đã chọn nhóm " + code;

        const res = await fetch("/api/hs/external/find-by-leaf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ leaf_code: code }),
        });
        const data = await res.json();

        addBot(
          `<b>${data.leaf_code}</b> – ${data.leaf_name}<br><br>` +
            data.items.map((i) => `${i.code} – ${i.name}`).join("<br>") +
            `<br><br><i>👉 Nhập mô tả chi tiết để xác nhận</i>`
        );
      }

      /* STEP 3 */
      async function confirmHs(text) {
        statusBadge.textContent = "🔍 Đang xác nhận HS...";

        const bot = addBot("");
        const res = await fetch("/api/hs/external/confirm-hs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ leaf_code: selectedLeaf, query: text }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          bot.innerHTML += decoder.decode(value);
        }

        statusBadge.textContent = "✅ Hoàn tất";
        statusBadge.className = "status-badge done";
      }
    </script>
  </body>
</html>
